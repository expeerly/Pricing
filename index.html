<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expeerly Pricing Calculator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.23.9/babel.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .slider-thumb::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%; background: #6B4EFF; cursor: pointer; }
    .slider-thumb::-moz-range-thumb { width: 20px; height: 20px; border-radius: 50%; background: #6B4EFF; cursor: pointer; border: none; }
    .internal-badge { background: linear-gradient(135deg, #FFF3CD, #FFE082); }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo } = React;

    // ── Constants ──────────────────────────────────────────────────────────────
    const PLATFORM_FEE   = 15000;
    const BASE_REVIEWS   = 15;
    const QUARTERLY_MULT = 1.20;
    const ONBOARDING_FEE = 1750;

    const B2B_LEVELS = { low: 1000, medium: 2500, high: 5000 };

    const DEFAULT_PRICING_CONFIG = {
      basePrice: {
        standardGifted: 500,
        mdaGifted:      800,
        standardLoan:   500,
        mdaLoan:        800,
        cheapProduct:   250,
      },
      loanSurcharge: {
        standardLoan: 500,
        mdaLoan:      850,
      },
      tiers: [
        { from: 1,   to: 30,       discount: 0    },
        { from: 31,  to: 50,       discount: 0.10 },
        { from: 51,  to: 100,      discount: 0.15 },
        { from: 101, to: Infinity, discount: 0.20 },
      ],
    };

    const PACKAGE_COLORS = [
      { header: 'bg-gradient-to-br from-gray-600 to-gray-800', border: 'border-gray-200', tab: 'bg-gray-700' },
      { header: 'bg-gradient-to-br from-[#6B4EFF] to-[#8B6FFF]', border: 'border-[#6B4EFF]', tab: 'bg-[#6B4EFF]' },
      { header: 'bg-gradient-to-br from-[#FF4E8E] to-[#FF6FA8]', border: 'border-[#FF4E8E]', tab: 'bg-[#FF4E8E]' },
    ];

    const ALL_KEYS = ['standardGifted', 'mdaGifted', 'standardLoan', 'mdaLoan', 'cheapProduct'];

    // ── Helpers ────────────────────────────────────────────────────────────────
    const fmt    = n => 'CHF ' + Math.round(n).toLocaleString('de-CH');
    const fmtPct = n => (n * 100).toFixed(0) + '%';
    const mixTotal = m => ALL_KEYS.reduce((s, k) => s + (m[k] || 0), 0);

    function emptyMix() {
      return { standardGifted: 0, mdaGifted: 0, standardLoan: 0, mdaLoan: 0, cheapProduct: 0 };
    }

    function applyFormatMultiplier(mix, mult) {
      const r = {};
      ALL_KEYS.forEach(k => r[k] = (mix[k] || 0) * mult);
      return r;
    }

    function scaleMix(mix, targetTotal) {
      const total = mixTotal(mix);
      if (total === 0 || targetTotal === 0) return emptyMix();
      const ratio = targetTotal / total;
      const s = {};
      ALL_KEYS.forEach(k => s[k] = Math.round((mix[k] || 0) * ratio));
      const diff = targetTotal - mixTotal(s);
      if (diff !== 0) {
        const largest = ALL_KEYS.filter(k => (mix[k] || 0) > 0)
          .reduce((a, b) => (mix[a] || 0) >= (mix[b] || 0) ? a : b, ALL_KEYS[0]);
        s[largest] = Math.max(0, s[largest] + diff);
      }
      return s;
    }

    function calcTieredFee(aboveMix, aboveTotal, config) {
      if (aboveTotal === 0) return 0;
      let fee = 0, priced = 0;
      for (const tier of config.tiers) {
        if (priced >= aboveTotal) break;
        const capacity = tier.to === Infinity ? Infinity : (tier.to - tier.from + 1);
        const inTier = Math.min(aboveTotal - priced, capacity);
        if (inTier <= 0) continue;
        const mult = 1 - tier.discount;
        ALL_KEYS.forEach(k => {
          const proportion = (aboveMix[k] || 0) / aboveTotal;
          fee += proportion * inTier * (config.basePrice[k] || 0) * mult;
        });
        priced += inTier;
      }
      return fee;
    }

    function calcTierBreakdown(aboveMix, aboveTotal, config) {
      if (aboveTotal === 0) return [];
      const result = [];
      let priced = 0;
      for (const tier of config.tiers) {
        if (priced >= aboveTotal) break;
        const capacity = tier.to === Infinity ? Infinity : (tier.to - tier.from + 1);
        const inTier = Math.min(aboveTotal - priced, capacity);
        if (inTier <= 0) continue;
        let tierFee = 0;
        ALL_KEYS.forEach(k => {
          tierFee += ((aboveMix[k] || 0) / aboveTotal) * inTier * (config.basePrice[k] || 0) * (1 - tier.discount);
        });
        result.push({
          label:    tier.to === Infinity ? `${tier.from}+` : `${tier.from}–${tier.to}`,
          count:    Math.round(inTier),
          discount: tier.discount,
          fee:      tierFee,
        });
        priced += inTier;
      }
      return result;
    }

    function getLoadbeeFee(subTotal, chOnly) {
      if (chOnly) return 500;
      return subTotal <= 17500 ? 1500 : 2500;
    }

    // ── Core price calculation ─────────────────────────────────────────────────
    function calcPackage(pkgInputs, shared, pricingConfig) {
      const formatMult   = pkgInputs.reviewFormat === 'both' ? 2 : 1;
      const effectiveMix = applyFormatMultiplier(pkgInputs.reviewMix, formatMult);
      const targetTotal  = Math.max(BASE_REVIEWS, mixTotal(effectiveMix));
      const scaledMix    = scaleMix(effectiveMix, targetTotal);

      // Existing catalog
      const existingStdFee = pkgInputs.existingStandard * 150;
      const existingMDAFee = pkgInputs.existingMDA * 250;
      const existingFee    = existingStdFee + existingMDAFee;

      // New reviews above base — tiered
      const aboveBase     = Math.max(0, targetTotal - BASE_REVIEWS);
      const aboveMix      = aboveBase > 0 ? scaleMix(effectiveMix, aboveBase) : emptyMix();
      const newRevFee     = calcTieredFee(aboveMix, aboveBase, pricingConfig);
      const tierBreakdown = calcTierBreakdown(aboveMix, aboveBase, pricingConfig);

      // Loan surcharges (not on cheap product)
      const loanSurcharge =
        (scaledMix.standardLoan || 0) * pricingConfig.loanSurcharge.standardLoan +
        (scaledMix.mdaLoan      || 0) * pricingConfig.loanSurcharge.mdaLoan;

      // B2B surcharge
      const b2bFee = shared.b2bRequired ? B2B_LEVELS[shared.b2bLevel] * targetTotal : 0;

      // Onboarding
      const onboardingFee = shared.newCustomer ? ONBOARDING_FEE : 0;

      // Sub-total before Loadbee & CS surcharge
      const subTotal = PLATFORM_FEE + existingFee + newRevFee + loanSurcharge + b2bFee;

      // Loadbee
      const loadbeeFee = shared.loadbee ? getLoadbeeFee(subTotal, shared.loadbeeRegion === 'ch') : 0;

      // Advanced CS surcharge (internal, applied on top of everything)
      const csMult       = shared.csRequired ? (1 + shared.csSurcharge / 100) : 1;
      const annualBase   = (subTotal + loadbeeFee) * csMult;
      const csFee        = (subTotal + loadbeeFee) * (csMult - 1);

      // Payment terms (per-package)
      const qMult          = pkgInputs.paymentTerms === 'quarterly' ? QUARTERLY_MULT : 1;
      const annualCustomer = annualBase * qMult;
      const quarterlyAmt   = pkgInputs.paymentTerms === 'quarterly' ? annualCustomer / 4 : null;
      const cl             = pkgInputs.contractLength;
      const totalContract  = annualCustomer * cl + onboardingFee;

      // Price-freeze savings
      const newStd = (scaledMix.standardGifted || 0) + (scaledMix.standardLoan || 0) + (scaledMix.cheapProduct || 0);
      const newMDA = (scaledMix.mdaGifted || 0) + (scaledMix.mdaLoan || 0);
      const yearlyIncrease = newStd * 150 + newMDA * 250;
      let savings = null;
      if (cl > 1 && yearlyIncrease > 0) {
        savings = 0;
        for (let yr = 2; yr <= cl; yr++) savings += yearlyIncrease * (yr - 1) * qMult;
      }

      return {
        targetTotal, scaledMix, aboveMix, aboveBase, effectiveMix, formatMult,
        existingStdFee, existingMDAFee, existingFee,
        newRevFee, loanSurcharge, b2bFee, tierBreakdown,
        csFee, loadbeeFee, onboardingFee, subTotal, annualBase,
        annualCustomer, quarterlyAmt, totalContract, savings,
      };
    }

    // ── UI Primitives ─────────────────────────────────────────────────────────
    function Toggle({ value, onChange, options, small }) {
      return (
        <div className="flex rounded-lg border border-gray-200 overflow-hidden w-fit">
          {options.map(opt => (
            <button key={opt.value} onClick={() => onChange(opt.value)}
              className={`${small ? 'px-2.5 py-1 text-xs' : 'px-3 py-1.5 text-sm'} font-medium transition-colors ${value === opt.value ? 'bg-[#6B4EFF] text-white' : 'bg-white text-gray-600 hover:bg-gray-50'}`}>
              {opt.label}
            </button>
          ))}
        </div>
      );
    }

    function Section({ label, children, internal }) {
      return (
        <div className={`rounded-xl p-4 mb-3 ${internal ? 'internal-badge border border-yellow-300' : 'bg-white border border-gray-100 shadow-sm'}`}>
          {internal && <div className="text-xs font-bold text-amber-700 uppercase tracking-wide mb-2">🔒 Internal Only</div>}
          {label && <div className="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-3">{label}</div>}
          {children}
        </div>
      );
    }

    function NumInput({ value, onChange, className }) {
      return (
        <input type="number" min="0" value={value}
          onChange={e => onChange(Math.max(0, parseInt(e.target.value) || 0))}
          className={`border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#6B4EFF] ${className || ''}`}
        />
      );
    }

    function Row({ label, val, indent, accent, sub }) {
      return (
        <div className={`flex justify-between text-sm ${indent || sub ? 'pl-3' : ''} ${sub ? 'text-gray-400 text-xs' : indent ? 'text-gray-500' : 'text-gray-600'} ${accent ? 'text-[#6B4EFF]' : ''}`}>
          <span>{label}</span>
          <span className="font-medium tabular-nums ml-2 shrink-0">{val}</span>
        </div>
      );
    }

    // ── Package Card ───────────────────────────────────────────────────────────
    function PackageCard({ index, pkgInputs, shared, data }) {
      const color         = PACKAGE_COLORS[index];
      const isQ           = pkgInputs.paymentTerms === 'quarterly';
      const cl            = pkgInputs.contractLength;
      const isMultiYr     = cl > 1;
      const totalExisting = pkgInputs.existingStandard + pkgInputs.existingMDA;
      const bothFmts      = pkgInputs.reviewFormat === 'both';

      const items = [];

      const perQ = Math.ceil(data.targetTotal / 4);
      items.push({ text: `Up to ${data.targetTotal} new reviews/year (up to ${perQ}/quarter)` });

      const typeLines = [];
      if ((data.scaledMix.standardGifted || 0) > 0) typeLines.push(`${data.scaledMix.standardGifted} standard gifted`);
      if ((data.scaledMix.mdaGifted      || 0) > 0) typeLines.push(`${data.scaledMix.mdaGifted} MDA gifted`);
      if ((data.scaledMix.standardLoan   || 0) > 0) typeLines.push(`${data.scaledMix.standardLoan} standard loan`);
      if ((data.scaledMix.mdaLoan        || 0) > 0) typeLines.push(`${data.scaledMix.mdaLoan} MDA loan`);
      if ((data.scaledMix.cheapProduct   || 0) > 0) typeLines.push(`${data.scaledMix.cheapProduct} cheap product (<CHF 100)`);
      if (typeLines.length > 0) items.push({ text: typeLines.join(' · '), sub: true });

      items.push({ text: bothFmts ? 'Both formats: vertical + horizontal' : 'Single format (vertical or horizontal)' });
      items.push({ text: `Full usage rights + syndication for up to ${data.targetTotal} new reviews — current subscription year only` });

      if (totalExisting > 0) {
        const parts = [];
        if (pkgInputs.existingStandard > 0) parts.push(`${pkgInputs.existingStandard} standard (CHF 150 each)`);
        if (pkgInputs.existingMDA      > 0) parts.push(`${pkgInputs.existingMDA} MDA (CHF 250 each)`);
        items.push({ text: `${totalExisting} existing catalog review${totalExisting > 1 ? 's' : ''} kept live` });
        items.push({ text: parts.join(' · '), sub: true });
        items.push({ text: `Usage rights + syndication for ${totalExisting} existing reviews — current subscription year only` });
      } else {
        items.push({ text: '0 existing reviews this year — usage rights + syndication will apply from year 2 onwards' });
      }

      items.push({ text: 'AI translations + subtitles in all languages' });
      if (shared.loadbee)     items.push({ text: 'Loadbee & Flixmedia distribution' });
      if (shared.b2bRequired) items.push({ text: `B2B/Specialist community — ${shared.b2bLevel} level` });
      items.push({ text: isQ ? `Quarterly payments (4 × ${fmt(data.quarterlyAmt)})` : 'Annual upfront payment' });
      items.push({ text: isMultiYr ? `${cl}-year contract — price frozen at today's rate` : '1-year contract' });

      return (
        <div className={`rounded-2xl border-2 ${color.border} bg-white shadow-sm flex flex-col`}>
          <div className={`${color.header} rounded-t-2xl px-5 py-4`}>
            <div className="text-xs font-bold uppercase tracking-widest text-white/70 mb-1">Package {index + 1}</div>
            <div className="text-xl font-bold text-white">{pkgInputs.name || `Package ${index + 1}`}</div>
          </div>

          <div className="px-5 py-4 flex-1 flex flex-col gap-4">
            <div className="flex items-center gap-2 flex-wrap">
              <span className="text-xs font-semibold bg-[#6B4EFF] text-white px-2.5 py-0.5 rounded-full">{cl}y contract</span>
              {isMultiYr && <span className="text-xs font-bold text-[#6B4EFF] bg-purple-50 px-2 py-0.5 rounded-full">Price Frozen</span>}
              {isQ && <span className="text-xs font-bold text-orange-600 bg-orange-50 px-2 py-0.5 rounded-full">Quarterly +20%</span>}
            </div>

            <div>
              <div className="text-3xl font-bold text-gray-900 tabular-nums">{fmt(data.annualCustomer)}</div>
              <div className="text-sm text-gray-500">per year, excl. VAT</div>
              {isQ && <div className="text-sm font-semibold text-[#6B4EFF] mt-0.5">{fmt(data.quarterlyAmt)}/quarter</div>}
              {isMultiYr && (
                <div className="text-sm font-semibold text-gray-700 mt-0.5">
                  {cl}y total: {fmt(data.totalContract)}
                  {shared.newCustomer && <span className="text-xs text-gray-400"> incl. onboarding</span>}
                </div>
              )}
              {shared.newCustomer && !isMultiYr && (
                <div className="text-sm text-gray-500 mt-0.5">+ {fmt(ONBOARDING_FEE)} one-time onboarding</div>
              )}
              {data.savings != null && data.savings > 0 && (
                <div className="mt-1.5 bg-green-50 border border-green-200 rounded-lg px-3 py-1.5 text-xs text-green-800 font-medium">
                  Save {fmt(data.savings)} over {cl} years by locking in today's rate
                </div>
              )}
            </div>

            <div className="space-y-1">
              <div className="font-semibold text-gray-700 text-sm mb-1.5">Price Breakdown:</div>
              <Row label={`Platform fee (incl. ${BASE_REVIEWS} base reviews)`} val={fmt(PLATFORM_FEE)} />
              {data.existingStdFee > 0 && <Row label={`${pkgInputs.existingStandard} existing standard @ CHF 150`} val={fmt(data.existingStdFee)} indent />}
              {data.existingMDAFee > 0 && <Row label={`${pkgInputs.existingMDA} existing MDA @ CHF 250`} val={fmt(data.existingMDAFee)} indent />}
              {data.aboveBase > 0 && (
                <>
                  <Row label={`${data.aboveBase} new reviews above base`} val={fmt(data.newRevFee)} indent />
                  {data.tierBreakdown.filter(t => t.count > 0).map((t, i) => (
                    <Row key={i} label={`  Reviews ${t.label}${t.discount > 0 ? ` (−${fmtPct(t.discount)})` : ' (full price)'}`} val={`${t.count} reviews`} sub />
                  ))}
                </>
              )}
              {(data.scaledMix.standardLoan || 0) > 0 && <Row label={`${data.scaledMix.standardLoan} std loan surcharge @ CHF 500`} val={fmt((data.scaledMix.standardLoan || 0) * 500)} indent />}
              {(data.scaledMix.mdaLoan      || 0) > 0 && <Row label={`${data.scaledMix.mdaLoan} MDA loan surcharge @ CHF 850`} val={fmt((data.scaledMix.mdaLoan || 0) * 850)} indent />}
              {data.b2bFee     > 0 && <Row label={`B2B/Specialist (${shared.b2bLevel}) × ${data.targetTotal}`} val={fmt(data.b2bFee)} indent />}
              {data.loadbeeFee > 0 && <Row label="Loadbee/Flixmedia" val={fmt(data.loadbeeFee)} indent />}
              {data.csFee      > 0 && <Row label={`Advanced CS requirement (+${shared.csSurcharge}%)`} val={fmt(data.csFee)} indent />}
              {isQ && <Row label="Quarterly surcharge (+20%)" val={`+${fmt(data.annualBase * 0.20)}`} accent />}
              {shared.newCustomer && (
                <Row label={`One-time onboarding fee`} val={fmt(ONBOARDING_FEE)} indent />
              )}
              <div className="flex justify-between font-bold text-gray-900 border-t border-gray-200 pt-2 mt-1 text-sm">
                <span>{shared.newCustomer ? 'First year total (incl. onboarding)' : 'Annual total'}</span>
                <span className="tabular-nums">{fmt(data.annualCustomer + (shared.newCustomer ? ONBOARDING_FEE : 0))}</span>
              </div>
            </div>

            <div className="border-t border-gray-100 pt-3 flex-1">
              <div className="font-semibold text-gray-700 mb-2 text-sm">What's included:</div>
              <ul className="space-y-1.5 text-xs">
                {items.map((item, i) => (
                  <li key={i} className={item.sub ? 'pl-4 text-gray-400' : 'flex gap-1.5 text-gray-600'}>
                    {!item.sub && <span className="text-green-500 shrink-0 mt-px">✓</span>}
                    <span>{item.text}</span>
                  </li>
                ))}
              </ul>
            </div>
          </div>
        </div>
      );
    }

    // ── Pricing Config Table ───────────────────────────────────────────────────
    function PricingConfigTable({ config, setConfig }) {
      const setBase      = (k, v) => setConfig(c => ({ ...c, basePrice:     { ...c.basePrice,     [k]: v } }));
      const setSurcharge = (k, v) => setConfig(c => ({ ...c, loanSurcharge: { ...c.loanSurcharge, [k]: v } }));
      const setTierDiscount = (i, v) => setConfig(c => ({
        ...c,
        tiers: c.tiers.map((t, idx) => idx === i ? { ...t, discount: Math.min(1, Math.max(0, v / 100)) } : t),
      }));
      const setTierTo = (i, v) => setConfig(c => {
        const tiers = c.tiers.map((t, idx) => idx === i ? { ...t, to: v <= 0 ? Infinity : v } : t);
        for (let j = 1; j < tiers.length; j++) {
          tiers[j] = { ...tiers[j], from: tiers[j - 1].to === Infinity ? tiers[j - 1].from + 1 : tiers[j - 1].to + 1 };
        }
        return { ...c, tiers };
      });

      const INPUT = 'w-20 border border-gray-200 rounded px-2 py-1 text-sm text-right focus:outline-none focus:ring-1 focus:ring-[#6B4EFF]';

      return (
        <div className="internal-badge rounded-xl border border-yellow-300 p-5">
          <div className="flex items-center justify-between mb-4">
            <div>
              <div className="text-sm font-bold text-amber-800 uppercase tracking-wide">🔒 Pricing Configuration — Internal</div>
              <div className="text-xs text-amber-700 mt-0.5">Changes apply to all packages in real time</div>
            </div>
            <button onClick={() => setConfig(DEFAULT_PRICING_CONFIG)}
              className="text-xs text-amber-700 border border-amber-400 px-3 py-1.5 rounded-lg hover:bg-amber-100 font-medium">
              Reset to defaults
            </button>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div>
              <div className="text-xs font-semibold text-gray-700 uppercase tracking-wide mb-3">Base Prices (above {BASE_REVIEWS} base reviews)</div>
              <div className="bg-white/70 rounded-lg overflow-hidden border border-yellow-200">
                <table className="w-full text-xs">
                  <thead>
                    <tr className="bg-yellow-100/50">
                      <th className="text-left px-3 py-2 font-semibold text-gray-600">Review Type</th>
                      <th className="text-right px-3 py-2 font-semibold text-gray-600">CHF/review</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-yellow-100">
                    {[
                      { k: 'standardGifted', label: 'Standard gifted' },
                      { k: 'mdaGifted',      label: 'MDA gifted' },
                      { k: 'standardLoan',   label: 'Standard loan' },
                      { k: 'mdaLoan',        label: 'MDA loan' },
                      { k: 'cheapProduct',   label: 'Cheap product (<CHF 100)' },
                    ].map(({ k, label }) => (
                      <tr key={k}>
                        <td className="px-3 py-2 text-gray-700">{label}</td>
                        <td className="px-3 py-2 text-right">
                          <input type="number" min="0" value={config.basePrice[k]}
                            onChange={e => setBase(k, parseFloat(e.target.value) || 0)}
                            className={INPUT} />
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>

              <div className="text-xs font-semibold text-gray-700 uppercase tracking-wide mt-4 mb-3">Loan Surcharges</div>
              <div className="bg-white/70 rounded-lg overflow-hidden border border-yellow-200">
                <table className="w-full text-xs">
                  <thead>
                    <tr className="bg-yellow-100/50">
                      <th className="text-left px-3 py-2 font-semibold text-gray-600">Type</th>
                      <th className="text-right px-3 py-2 font-semibold text-gray-600">CHF/product</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-yellow-100">
                    {[
                      { k: 'standardLoan', label: 'Standard loan' },
                      { k: 'mdaLoan',      label: 'MDA loan' },
                    ].map(({ k, label }) => (
                      <tr key={k}>
                        <td className="px-3 py-2 text-gray-700">{label}</td>
                        <td className="px-3 py-2 text-right">
                          <input type="number" min="0" value={config.loanSurcharge[k]}
                            onChange={e => setSurcharge(k, parseFloat(e.target.value) || 0)}
                            className={INPUT} />
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
              <p className="text-xs text-amber-700 mt-1.5">Cheap products have no surcharge.</p>
            </div>

            <div className="lg:col-span-2">
              <div className="text-xs font-semibold text-gray-700 uppercase tracking-wide mb-3">Volume Discount Tiers (reviews above base {BASE_REVIEWS})</div>
              <div className="bg-white/70 rounded-lg overflow-hidden border border-yellow-200">
                <table className="w-full text-xs">
                  <thead>
                    <tr className="bg-yellow-100/50">
                      <th className="text-center px-3 py-2 font-semibold text-gray-600">From</th>
                      <th className="text-center px-3 py-2 font-semibold text-gray-600">To</th>
                      <th className="text-center px-3 py-2 font-semibold text-gray-600">Discount %</th>
                      <th className="text-left px-3 py-2 font-semibold text-gray-600">Effective price per review</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-yellow-100">
                    {config.tiers.map((tier, i) => {
                      const isLast = i === config.tiers.length - 1;
                      return (
                        <tr key={i}>
                          <td className="px-3 py-2 text-center text-gray-600 font-medium">{tier.from}</td>
                          <td className="px-3 py-2 text-center">
                            {isLast ? (
                              <span className="text-gray-500 italic">unlimited</span>
                            ) : (
                              <input type="number" min={tier.from} value={tier.to}
                                onChange={e => setTierTo(i, parseInt(e.target.value) || 0)}
                                className={INPUT + ' w-16'} />
                            )}
                          </td>
                          <td className="px-3 py-2 text-center">
                            <div className="flex items-center justify-center gap-1">
                              <input type="number" min="0" max="100" value={Math.round(tier.discount * 100)}
                                onChange={e => setTierDiscount(i, parseFloat(e.target.value) || 0)}
                                className={INPUT + ' w-14'} />
                              <span className="text-gray-500">%</span>
                            </div>
                          </td>
                          <td className="px-3 py-2">
                            <div className="space-y-0.5">
                              {[
                                { label: 'Std gifted', k: 'standardGifted' },
                                { label: 'MDA gifted', k: 'mdaGifted' },
                                { label: 'Std loan',   k: 'standardLoan' },
                                { label: 'MDA loan',   k: 'mdaLoan' },
                                { label: 'Cheap',      k: 'cheapProduct' },
                              ].map(({ label, k }) => (
                                <div key={k} className="flex justify-between gap-4">
                                  <span className="text-gray-400">{label}</span>
                                  <span className="font-medium text-gray-700">CHF {Math.round(config.basePrice[k] * (1 - tier.discount))}</span>
                                </div>
                              ))}
                            </div>
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
              <p className="text-xs text-amber-700 mt-1.5">
                Reviews fill tiers in order. First {config.tiers[0]?.to} above base at full price, then discounts apply.
              </p>
            </div>
          </div>
        </div>
      );
    }

    // ── Per-package Input Panel ────────────────────────────────────────────────
    const REVIEW_TYPE_ROWS = [
      { key: 'standardGifted', label: 'Standard gifted reviews',  hint: 'Volume pricing applies (see config below)' },
      { key: 'mdaGifted',      label: 'MDA gifted reviews',       hint: 'Incl. MDA surcharge — volume pricing applies' },
      { key: 'standardLoan',   label: 'Standard loan products',   hint: 'Per-review price + CHF 500 surcharge/product' },
      { key: 'mdaLoan',        label: 'MDA loan products',        hint: 'Per-review price + CHF 850 surcharge/product' },
      { key: 'cheapProduct',   label: 'Cheap product (<CHF 100)', hint: 'Flat CHF 250/review — no surcharge' },
    ];

    function PackageInputs({ pkg, setPkg }) {
      const setMix = (k, v) => setPkg(p => ({ ...p, reviewMix: { ...p.reviewMix, [k]: v } }));
      const set    = (k, v) => setPkg(p => ({ ...p, [k]: v }));
      const rawTotal  = mixTotal(pkg.reviewMix);
      const fmtMult   = pkg.reviewFormat === 'both' ? 2 : 1;
      const effective = rawTotal * fmtMult;

      return (
        <div>
          <Section label="Package Name">
            <input type="text" value={pkg.name} onChange={e => set('name', e.target.value)}
              className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#6B4EFF]"
              placeholder="e.g. Starter, Growth, Scale..." />
          </Section>

          <Section label="Payment Terms">
            <Toggle value={pkg.paymentTerms} onChange={v => set('paymentTerms', v)} options={[
              { value: 'annual',    label: 'Annual Upfront' },
              { value: 'quarterly', label: 'Quarterly (+20%)' },
            ]} />
            {pkg.paymentTerms === 'quarterly' && (
              <p className="text-xs text-orange-600 font-medium mt-2">Quarterly billing adds +20% to annual price</p>
            )}
          </Section>

          <Section label="Review Format">
            <Toggle value={pkg.reviewFormat} onChange={v => set('reviewFormat', v)} options={[
              { value: 'single', label: 'Single Format' },
              { value: 'both',   label: 'Both Formats (×2)' },
            ]} />
            {pkg.reviewFormat === 'both' && (
              <p className="text-xs text-amber-600 font-medium mt-2">Both formats — review count doubled for pricing</p>
            )}
          </Section>

          <Section label="New Reviews / Year — by Type">
            <div className="space-y-3">
              {REVIEW_TYPE_ROWS.map(row => (
                <div key={row.key} className="flex items-start gap-3">
                  <NumInput value={pkg.reviewMix[row.key]} onChange={v => setMix(row.key, v)} className="w-20 shrink-0" />
                  <div>
                    <div className="text-sm font-medium text-gray-700">{row.label}</div>
                    <div className="text-xs text-gray-400">{row.hint}</div>
                  </div>
                </div>
              ))}
            </div>
            {rawTotal > 0 && (
              <div className="mt-3 pt-3 border-t border-gray-100 text-xs space-y-0.5">
                {fmtMult > 1 && (
                  <div className="flex justify-between text-gray-500">
                    <span>{rawTotal} products × {fmtMult} formats</span>
                    <span className="font-bold text-[#6B4EFF]">{effective} reviews (priced)</span>
                  </div>
                )}
                <div className="flex justify-between text-gray-500">
                  <span>Total priced:</span>
                  <span className="font-semibold text-gray-700">up to {Math.max(BASE_REVIEWS, effective)} reviews (min. {BASE_REVIEWS})</span>
                </div>
              </div>
            )}
          </Section>

          <Section label="Existing Catalog Reviews (Kept Live)">
            <div className="flex gap-3">
              <div className="flex-1">
                <label className="text-xs text-gray-500 mb-1 block">Standard</label>
                <NumInput value={pkg.existingStandard} onChange={v => set('existingStandard', v)} className="w-full" />
                <p className="text-xs text-gray-400 mt-1">CHF 150/review</p>
              </div>
              <div className="flex-1">
                <label className="text-xs text-gray-500 mb-1 block">MDA</label>
                <NumInput value={pkg.existingMDA} onChange={v => set('existingMDA', v)} className="w-full" />
                <p className="text-xs text-gray-400 mt-1">CHF 250/review</p>
              </div>
            </div>
          </Section>

          <Section label="Contract Length">
            <Toggle value={pkg.contractLength} onChange={v => set('contractLength', v)} options={[
              { value: 1, label: '1 Year' }, { value: 2, label: '2 Years' }, { value: 3, label: '3 Years' },
            ]} />
            {pkg.contractLength > 1 && (
              <p className="text-xs text-gray-500 mt-2">Price frozen — locks in today's rate for all {pkg.contractLength} years</p>
            )}
          </Section>
        </div>
      );
    }

    // ── Default package state ──────────────────────────────────────────────────
    const DEFAULT_PKG = n => ({
      name:            n,
      paymentTerms:    'annual',
      reviewFormat:    'single',
      reviewMix:       { standardGifted: 0, mdaGifted: 0, standardLoan: 0, mdaLoan: 0, cheapProduct: 0 },
      existingStandard: 0,
      existingMDA:      0,
      contractLength:   1,
    });

    // ── App ────────────────────────────────────────────────────────────────────
    function App() {
      const [shared, setShared] = useState({
        customerName:  '',
        newCustomer:   false,
        b2bRequired:   false,
        b2bLevel:      'medium',
        csRequired:    false,
        csSurcharge:   20,
        loadbee:       false,
        loadbeeRegion: 'ch',
      });
      const [pkgs, setPkgs] = useState([
        DEFAULT_PKG('Package 1'),
        DEFAULT_PKG('Package 2'),
        DEFAULT_PKG('Package 3'),
      ]);
      const [pricingConfig, setPricingConfig] = useState(DEFAULT_PRICING_CONFIG);
      const [activeTab, setActiveTab] = useState(0);

      const setS   = (k, v) => setShared(p => ({ ...p, [k]: v }));
      const setPkg = (i, updater) => setPkgs(p => p.map((pkg, idx) => idx === i ? (typeof updater === 'function' ? updater(pkg) : updater) : pkg));

      const computed = useMemo(() => pkgs.map(pkg => calcPackage(pkg, shared, pricingConfig)), [pkgs, shared, pricingConfig]);

      return (
        <div className="min-h-screen bg-gray-50">
          <header className="bg-white border-b border-gray-200 px-6 py-4 flex items-center justify-between">
            <div className="flex items-center gap-3">
              <div className="w-8 h-8 rounded-lg bg-[#6B4EFF] flex items-center justify-center">
                <span className="text-white font-bold text-sm">E</span>
              </div>
              <span className="text-xl font-bold text-gray-900">expeerly</span>
              <span className="text-sm text-gray-400 font-medium">Internal Pricing Calculator</span>
            </div>
            <div className="text-xs text-gray-400 bg-gray-100 px-3 py-1.5 rounded-full font-medium">Internal Use Only — Sales Team</div>
          </header>

          <div className="flex flex-col lg:flex-row min-h-[calc(100vh-65px)]">

            {/* ── Left: Shared + Package Inputs ── */}
            <div className="lg:w-[440px] shrink-0 bg-gray-50 border-r border-gray-200 flex flex-col">

              <div className="p-5 border-b border-gray-200">
                <h2 className="text-base font-bold text-gray-900 mb-3">Customer</h2>
                <div className="space-y-3">
                  <input type="text" placeholder="Company name" value={shared.customerName}
                    onChange={e => setS('customerName', e.target.value)}
                    className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#6B4EFF]"
                  />
                  <label className="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" checked={shared.newCustomer} onChange={e => setS('newCustomer', e.target.checked)} className="w-4 h-4 accent-[#6B4EFF]" />
                    <span className="text-sm text-gray-700">New customer <span className="text-gray-400">(+CHF 1,750 onboarding)</span></span>
                  </label>
                </div>

                {/* B2B */}
                <div className="mt-3 pt-3 border-t border-gray-100">
                  <div className="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2">B2B / Specialist</div>
                  <div className="flex items-center gap-3 mb-2">
                    <div onClick={() => setS('b2bRequired', !shared.b2bRequired)}
                      className={`w-11 h-6 rounded-full cursor-pointer transition-colors shrink-0 ${shared.b2bRequired ? 'bg-[#6B4EFF]' : 'bg-gray-300'}`}>
                      <div className="w-5 h-5 bg-white rounded-full shadow mt-0.5 transition-all" style={{ marginLeft: shared.b2bRequired ? '22px' : '2px' }} />
                    </div>
                    <span className="text-sm text-gray-700">Specialist community required</span>
                  </div>
                  {shared.b2bRequired && (
                    <div className="flex gap-2">
                      {[['low','Low','CHF 1,000'],['medium','Medium','CHF 2,500'],['high','High','CHF 5,000']].map(([v,l,p]) => (
                        <button key={v} onClick={() => setS('b2bLevel', v)}
                          className={`flex-1 py-1.5 rounded-lg text-xs font-semibold border-2 text-center transition-colors ${shared.b2bLevel === v ? 'border-[#6B4EFF] bg-[#6B4EFF] text-white' : 'border-gray-200 text-gray-600 hover:border-[#6B4EFF]'}`}>
                          {l}<br /><span className="font-normal opacity-80">{p}/review</span>
                        </button>
                      ))}
                    </div>
                  )}
                </div>

                {/* Loadbee */}
                <div className="mt-3 pt-3 border-t border-gray-100">
                  <div className="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2">Loadbee / Flixmedia</div>
                  <label className="flex items-center gap-2 cursor-pointer mb-2">
                    <input type="checkbox" checked={shared.loadbee} onChange={e => setS('loadbee', e.target.checked)} className="w-4 h-4 accent-[#6B4EFF]" />
                    <span className="text-sm text-gray-700">Include Loadbee/Flixmedia</span>
                  </label>
                  {shared.loadbee && (
                    <div>
                      <Toggle value={shared.loadbeeRegion} onChange={v => setS('loadbeeRegion', v)} options={[
                        { value: 'ch',    label: 'Switzerland only' },
                        { value: 'other', label: 'Other markets' },
                      ]} />
                      <p className="text-xs font-medium text-[#6B4EFF] mt-1.5">
                        {shared.loadbeeRegion === 'ch' ? '→ CHF 500/year' : '→ CHF 1,500 or CHF 2,500/year (based on contract value)'}
                      </p>
                    </div>
                  )}
                </div>

                {/* Advanced CS — INTERNAL */}
                <div className="mt-3 pt-3 border-t border-gray-100 internal-badge rounded-xl p-3">
                  <div className="text-xs font-bold text-amber-700 uppercase tracking-wide mb-2">🔒 Internal — Advanced Customer Success</div>
                  <p className="text-xs text-amber-600 mb-2">e.g. veto on reviewers, very niche target group, high-touch management</p>
                  <div className="flex items-center gap-3 mb-3">
                    <div onClick={() => setS('csRequired', !shared.csRequired)}
                      className={`w-11 h-6 rounded-full cursor-pointer transition-colors shrink-0 ${shared.csRequired ? 'bg-amber-500' : 'bg-gray-300'}`}>
                      <div className="w-5 h-5 bg-white rounded-full shadow mt-0.5 transition-all" style={{ marginLeft: shared.csRequired ? '22px' : '2px' }} />
                    </div>
                    <span className="text-sm text-amber-800 font-medium">Advanced CS required</span>
                  </div>
                  {shared.csRequired && (
                    <div>
                      <div className="flex justify-between text-xs text-amber-700 mb-1">
                        <span>+10%</span>
                        <span className="font-bold">+{shared.csSurcharge}% added to price</span>
                        <span>+50%</span>
                      </div>
                      <input type="range" min="10" max="50" step="5" value={shared.csSurcharge}
                        onChange={e => setS('csSurcharge', parseInt(e.target.value))}
                        className="w-full slider-thumb accent-amber-500 h-2 rounded-lg" />
                    </div>
                  )}
                </div>
              </div>

              {/* Package tabs */}
              <div className="flex-1 overflow-y-auto">
                <div className="flex border-b border-gray-200">
                  {pkgs.map((pkg, i) => (
                    <button key={i} onClick={() => setActiveTab(i)}
                      className={`flex-1 py-3 text-xs font-semibold transition-colors border-b-2 ${activeTab === i ? 'border-[#6B4EFF] text-[#6B4EFF] bg-white' : 'border-transparent text-gray-500 hover:text-gray-700 bg-gray-50'}`}>
                      <span className={`inline-block w-2 h-2 rounded-full mr-1.5 ${PACKAGE_COLORS[i].tab}`} />
                      {pkg.name || `Package ${i + 1}`}
                    </button>
                  ))}
                </div>
                <div className="p-5">
                  <PackageInputs pkg={pkgs[activeTab]} setPkg={updater => setPkg(activeTab, updater)} />
                </div>
              </div>
            </div>

            {/* ── Right: Output ── */}
            <div className="flex-1 p-5 overflow-y-auto">
              <div className="flex items-center justify-between mb-5">
                <h2 className="text-lg font-bold text-gray-900">
                  Package Options{shared.customerName ? ` — ${shared.customerName}` : ''}
                </h2>
                <span className="text-xs text-gray-400 bg-white border border-gray-200 px-3 py-1.5 rounded-full">Updates in real time</span>
              </div>

              <div className="grid grid-cols-1 xl:grid-cols-3 gap-5 mb-6">
                {pkgs.map((pkg, i) => (
                  <PackageCard key={i} index={i} pkgInputs={pkg} shared={shared} data={computed[i]} />
                ))}
              </div>

              <PricingConfigTable config={pricingConfig} setConfig={setPricingConfig} />
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
